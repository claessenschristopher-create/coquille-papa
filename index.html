<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coquille — Papa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f7;
            color: #17202a;
        }

        header {
            background: #173b57;
            color: white;
            padding: 22px 18px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 7px 0 0;
            opacity: 0.85;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 18px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            font-size: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        select,
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccd3d8;
            border-radius: 10px;
            font-size: 17px;
            margin-bottom: 15px;
            background: white;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-button {
            background: #1d7a46;
            color: white;
        }

        .settings-button {
            background: #52616b;
            color: white;
        }

        .save-button {
            background: #173b57;
            color: white;
        }

        .reset-button {
            background: #c0392b;
            color: white;
            margin-top: 10px;
        }

        .total-card {
            background: #173b57;
            color: white;
            text-align: center;
        }

        .total-label {
            font-size: 17px;
            opacity: 0.85;
        }

        .total {
            font-size: 38px;
            font-weight: bold;
            margin-top: 8px;
        }

        .weight-total {
            margin-top: 8px;
            font-size: 17px;
        }

        .entry {
            border: 1px solid #dfe4e7;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            background: #fafbfc;
        }

        .entry-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .entry-title {
            font-weight: bold;
        }

        .entry-details {
            margin-top: 7px;
            color: #52616b;
        }

        .delete-button {
            width: auto;
            padding: 7px 11px;
            background: #e74c3c;
            color: white;
            font-size: 14px;
        }

        .empty {
            text-align: center;
            color: #7b8790;
            padding: 15px 0;
        }

        .rates {
            font-size: 14px;
            color: #687780;
            margin-top: 10px;
            line-height: 1.6;
        }

        .settings {
            display: none;
        }

        .settings.open {
            display: block;
        }

        .success {
            display: none;
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            background: #dff3e7;
            color: #176b3a;
            font-weight: bold;
            text-align: center;
        }

        .success.show {
            display: block;
        }

        .separator {
            height: 1px;
            background: #e3e7e9;
            margin: 18px 0;
        }
    </style>
</head>

<body>

<header>
    <h1>🦪 Coquille — Papa</h1>
    <p>Suivi de la production</p>
</header>

<div class="container">

    <!-- AJOUT PRODUCTION -->

    <div class="card">

        <h2>➕ Ajouter une production</h2>

        <label for="type">Type de coquille</label>

        <select id="type">
            <option value="noix">
                Noix seule
            </option>

            <option value="corail">
                Noix + corail
            </option>
        </select>

        <label for="weight">Poids (kg)</label>

        <input
            id="weight"
            type="number"
            inputmode="decimal"
            step="0.01"
            min="0"
            placeholder="Exemple : 25,50"
        >

        <button
            class="add-button"
            onclick="addEntry()"
        >
            ➕ Ajouter
        </button>

        <div class="rates">
            Tarif noix seule :
            <strong id="displayRateNoix">
                1,66 €/kg
            </strong>
            <br>

            Tarif noix + corail :
            <strong id="displayRateCorail">
                1,56 €/kg
            </strong>
        </div>

    </div>


    <!-- TOTAL -->

    <div class="card total-card">

        <div class="total-label">
            💰 Total de la journée
        </div>

        <div class="total" id="total">
            0,00 €
        </div>

        <div class="weight-total" id="weightTotal">
            0,00 kg
        </div>

    </div>


    <!-- PRODUCTION -->

    <div class="card">

        <h2>📋 Production</h2>

        <div id="entries">

            <div class="empty">
                Aucune production enregistrée.
            </div>

        </div>

        <button
            class="reset-button"
            onclick="resetDay()"
        >
            🗑️ Nouvelle journée
        </button>

    </div>


    <!-- PARAMETRES -->

    <div class="card">

        <button
            class="settings-button"
            onclick="toggleSettings()"
        >
            ⚙️ Paramètres des tarifs
        </button>


        <div
            id="settings"
            class="settings"
        >

            <div class="separator"></div>

            <h2>⚙️ Modifier les tarifs</h2>

            <label for="rateNoix">
                Noix seule — €/kg
            </label>

            <input
                id="rateNoix"
                type="number"
                inputmode="decimal"
                step="0.01"
                min="0"
            >


            <label for="rateCorail">
                Noix + corail — €/kg
            </label>

            <input
                id="rateCorail"
                type="number"
                inputmode="decimal"
                step="0.01"
                min="0"
            >


            <button
                class="save-button"
                onclick="saveRates()"
            >
                💾 Enregistrer les tarifs
            </button>


            <div
                id="success"
                class="success"
            >
                ✅ Tarifs enregistrés
            </div>

        </div>

    </div>

</div>


<script>

    /*
    =====================================================
    TARIFS PAR DEFAUT
    =====================================================
    */

    const DEFAULT_RATE_NOIX = 1.66;
    const DEFAULT_RATE_CORAIL = 1.56;


    /*
    =====================================================
    RECUPERATION DES TARIFS
    =====================================================
    */

    let rateNoix = parseFloat(
        localStorage.getItem("coquillePapaRateNoix")
    );

    let rateCorail = parseFloat(
        localStorage.getItem("coquillePapaRateCorail")
    );


    if (isNaN(rateNoix)) {
        rateNoix = DEFAULT_RATE_NOIX;
    }

    if (isNaN(rateCorail)) {
        rateCorail = DEFAULT_RATE_CORAIL;
    }


    /*
    =====================================================
    RECUPERATION DES PRODUCTIONS
    =====================================================
    */

    let entries = JSON.parse(
        localStorage.getItem(
            "coquillePapaEntries"
        ) || "[]"
    );


    /*
    =====================================================
    FORMAT EURO
    =====================================================
    */

    function euro(value) {

        return value
            .toFixed(2)
            .replace(".", ",") + " €";

    }


    /*
    =====================================================
    FORMAT NOMBRE
    =====================================================
    */

    function number(value) {

        return value
            .toFixed(2)
            .replace(".", ",");

    }


    /*
    =====================================================
    SAUVEGARDE PRODUCTIONS
    =====================================================
    */

    function saveEntries() {

        localStorage.setItem(
            "coquillePapaEntries",
            JSON.stringify(entries)
        );

    }


    /*
    =====================================================
    AFFICHAGE TARIFS
    =====================================================
    */

    function updateRatesDisplay() {

        document.getElementById(
            "displayRateNoix"
        ).textContent =
            euro(rateNoix) + "/kg";


        document.getElementById(
            "displayRateCorail"
        ).textContent =
            euro(rateCorail) + "/kg";


        document.getElementById(
            "rateNoix"
        ).value = rateNoix;


        document.getElementById(
            "rateCorail"
        ).value = rateCorail;

    }


    /*
    =====================================================
    AJOUT PRODUCTION
    =====================================================
    */

    function addEntry() {

        const type =
            document.getElementById(
                "type"
            ).value;


        const weightInput =
            document.getElementById(
                "weight"
            ).value;


        const weight = parseFloat(
            weightInput.replace(",", ".")
        );


        if (!weight || weight <= 0) {

            alert(
                "Entre un poids valide."
            );

            return;
        }


        let rate;
        let label;


        if (type === "noix") {

            rate = rateNoix;
            label = "Noix seule";

        } else {

            rate = rateCorail;
            label = "Noix + corail";

        }


        const amount =
            weight * rate;


        entries.push({

            id: Date.now(),

            type: type,

            label: label,

            weight: weight,

            rate: rate,

            amount: amount

        });


        saveEntries();


        document.getElementById(
            "weight"
        ).value = "";


        render();

    }


    /*
    =====================================================
    SUPPRESSION D'UNE LIGNE
    =====================================================
    */

    function deleteEntry(id) {

        entries =
            entries.filter(
                entry =>
                    entry.id !== id
            );


        saveEntries();

        render();

    }


    /*
    =====================================================
    NOUVELLE JOURNEE
    =====================================================
    */

    function resetDay() {

        if (
            !confirm(
                "Supprimer toute la production de la journée ?"
            )
        ) {

            return;

        }


        entries = [];


        saveEntries();


        render();

    }


    /*
    =====================================================
    OUVRIR / FERMER PARAMETRES
    =====================================================
    */

    function toggleSettings() {

        const settings =
            document.getElementById(
                "settings"
            );


        settings.classList.toggle(
            "open"
        );

    }


    /*
    =====================================================
    ENREGISTRER LES TARIFS
    =====================================================
    */

    function saveRates() {

        const newRateNoix =
            parseFloat(
                document.getElementById(
                    "rateNoix"
                ).value
                .replace(",", ".")
            );


        const newRateCorail =
            parseFloat(
                document.getElementById(
                    "rateCorail"
                ).value
                .replace(",", ".")
            );


        if (
            isNaN(newRateNoix) ||
            newRateNoix < 0
        ) {

            alert(
                "Entre un tarif valide pour la noix."
            );

            return;

        }


        if (
            isNaN(newRateCorail) ||
            newRateCorail < 0
        ) {

            alert(
                "Entre un tarif valide pour le corail."
            );

            return;

        }


        rateNoix =
            newRateNoix;


        rateCorail =
            newRateCorail;


        localStorage.setItem(
            "coquillePapaRateNoix",
            rateNoix
        );


        localStorage.setItem(
            "coquillePapaRateCorail",
            rateCorail
        );


        updateRatesDisplay();


        const success =
            document.getElementById(
                "success"
            );


        success.classList.add(
            "show"
        );


        setTimeout(
            () => {
                success.classList.remove(
                    "show"
                );
            },
            2500
        );

    }


    /*
    =====================================================
    AFFICHAGE DES PRODUCTIONS
    =====================================================
    */

    function render() {

        const container =
            document.getElementById(
                "entries"
            );


        if (
            entries.length === 0
        ) {

            container.innerHTML = `
                <div class="empty">
                    Aucune production enregistrée.
                </div>
            `;

        } else {

            container.innerHTML = "";


            entries.forEach(
                entry => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "entry";


                    div.innerHTML = `

                        <div class="entry-top">

                            <div>

                                <div class="entry-title">
                                    ${entry.label}
                                </div>

                                <div class="entry-details">

                                    ${number(entry.weight)}
                                    kg

                                    ×

                                    ${number(entry.rate)}
                                    €/kg

                                    =

                                    <strong>
                                        ${euro(entry.amount)}
                                    </strong>

                                </div>

                            </div>


                            <button
                                class="delete-button"
                                onclick="deleteEntry(${entry.id})"
                            >
                                Supprimer
                            </button>

                        </div>

                    `;


                    container.appendChild(
                        div
                    );

                }
            );

        }


        let total = 0;

        let totalWeight = 0;


        entries.forEach(
            entry => {

                total +=
                    entry.amount;

                totalWeight +=
                    entry.weight;

            }
        );


        document.getElementById(
            "total"
        ).textContent =
            euro(total);


        document.getElementById(
            "weightTotal"
        ).textContent =
            number(totalWeight) +
            " kg";

    }


    /*
    =====================================================
    INITIALISATION
    =====================================================
    */

    updateRatesDisplay();

    render();

</script>

</body>
</html>
